[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statgen"
version = "0.1.0"
description = "Statistical genetics: genotype QC, stratification PCA, single-variant association, verified report"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest", "snakemake>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
