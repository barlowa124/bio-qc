name: "fcs_stats"
description: Per-channel summary statistics (mean/median/p95/negative
  fraction) over an events TSV produced by fcsio_parse.
keywords:
  - flow cytometry
  - qc
  - statistics
tools:
  - "fcs_stats":
      description: "Stdlib per-channel summary over an events matrix."
      homepage: "https://github.com/barlowa124/bio-qc"
      documentation: "https://github.com/barlowa124/bio-qc"
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - events:
      type: file
      description: Events TSV emitted by fcsio_parse
      pattern: "*.events.tsv"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - stats:
      type: file
      description: JSON per-channel summary stats
      pattern: "*.stats.json"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@barlowa124"
maintainers:
  - "@barlowa124"
