[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialqc"
version = "0.1.0"
description = "Visium spot-level QC metrics and filtering-strategy comparison"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
cluster = ["scanpy", "anndata", "igraph", "leidenalg"]
test = ["pytest"]

[project.scripts]
spatialqc = "spatialqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
