[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcsio"
version = "0.1.0"
description = "Stdlib FCS 3.x reader — vendor-quirk-aware header/TEXT/DATA parse, spillover extraction"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
