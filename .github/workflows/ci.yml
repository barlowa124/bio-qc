name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cytof-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: cytof_qc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/ -q

  cytof-qc-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: cytof_qc/app
        run: |
          npm ci
          npm run build

  organoid-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: organoid_qc
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          PYTHONPATH=src python -m pytest tests/ -q
          pip install snakemake && snakemake -n -s workflow/Snakefile

  fcs-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: fcs_io
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          PYTHONPATH=src python -m pytest tests/ -q

  spatial-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: spatial_qc
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          PYTHONPATH=src python -m pytest tests/ -q

  scrna-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: scrna_qc
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          PYTHONPATH=src python -m pytest tests/ -q
          PYTHONPATH=src snakemake -n -s workflow/Snakefile
          PYTHONPATH=src snakemake -s workflow/Snakefile -c1

  cmm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: cultivated_meat_multiomic
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python ci_fixtures.py
          python -m pytest tests/ -q

  statgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: statgen
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          PYTHONPATH=src python -m pytest tests/ -q
          PYTHONPATH=src snakemake -n -s workflow/Snakefile

  vendored-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest && python -m pytest tests/ -q

  cytof-qc-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: cytof_qc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../fcs_io snakemake
          snakemake -n -s workflow/Snakefile
          snakemake -s workflow/Snakefile -c1

  nextflow-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e fcs_io
      - name: Install Nextflow + nf-test
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo install -m 755 nextflow /usr/local/bin/
          curl -fsSL -o /tmp/nf-test.tgz \
            https://github.com/askimed/nf-test/releases/download/v0.9.5/nf-test-0.9.5.tar.gz
          tar -xzf /tmp/nf-test.tgz -C /tmp
          mkdir -p "$HOME/.nf-test"
          cp /tmp/nf-test.jar "$HOME/.nf-test/"
          sudo install -m 755 /tmp/nf-test /usr/local/bin/nf-test
      - working-directory: nf
        run: |
          nextflow run main.nf -stub-run
          nf-test test tests/main.nf.test \
            modules/local/fcsio_parse/tests/main.nf.test \
            modules/local/fcs_stats/tests/main.nf.test \
            modules/local/fcsio_demo/tests/main.nf.test
          nextflow run main.nf
          python3 ../scripts/run_receipts.py --verify \
            results/run_receipts.jsonl
