name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cytof-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: cytof_qc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests/ -q

  cytof-qc-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: cytof_qc/app
        run: |
          npm ci
          npm run build

  organoid-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: organoid_qc
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          PYTHONPATH=src python -m pytest tests/ -q
          pip install snakemake && snakemake -n -s workflow/Snakefile

  fcs-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: fcs_io
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          PYTHONPATH=src python -m pytest tests/ -q

  spatial-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: spatial_qc
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          PYTHONPATH=src python -m pytest tests/ -q

  cytof-qc-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: cytof_qc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../fcs_io snakemake
          snakemake -n -s workflow/Snakefile
          snakemake -s workflow/Snakefile -c1
